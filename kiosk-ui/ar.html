<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRENDUM — Дополненная реальность</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Высокоскоростной трекер QR и маркеров -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-glow: rgba(212, 160, 67, 0.4);
            --neon-blue: #00f2fe;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --bg: #0F0F12;
            --card-bg: rgba(24, 24, 29, 0.85);
            --text-main: #FFFFFF;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* ── Видеопоток камеры ── */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* ── Канвас для компьютерного зрения ── */
        #processing-canvas {
            display: none;
        }

        /* ── 3D Сцена дополненной реальности ── */
        #ar-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 5;
        }

        /* ── Оживающий слой поверх маркера ── */
        #ar-overlay-plane {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
            box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            transition: opacity 0.2s ease;
        }

        #ar-video-content, #ar-img-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── Пользовательский интерфейс HUD ── */
        .ar-hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            pointer-events: none;
        }

        .ar-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand-badge {
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 160, 67, 0.3);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .sound-btn {
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* ── Лазерная рамка видоискателя ── */
        .ar-scanner-frame {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            transition: border-color 0.3s, transform 0.3s;
        }

        .ar-scanner-frame.tracking-active {
            box-shadow: none;
            opacity: 0.15;
            transition: opacity 0.4s;
        }

        /* Уголки рамки */
        .frame-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3.5px solid var(--neon-blue);
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 20px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

        /* Бегающий лазер */
        .scan-laser {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scanLaserAnim 2.2s ease-in-out infinite;
        }

        @keyframes scanLaserAnim {
            0% { top: 12px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 245px; opacity: 0; }
        }

        .scan-hint {
            position: absolute;
            bottom: -50px;
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* ── Нижняя панель действий ── */
        .ar-bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .marker-preview-chip {
            background: rgba(24, 24, 29, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 50px;
            padding: 6px 16px 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .marker-thumb {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--primary);
        }

        /* ── Экран запроса камеры ── */
        #permission-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            gap: 20px;
        }

        .ar-start-icon {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.2) 0%, transparent 70%);
            border: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .ar-btn-start {
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            color: #000;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.15s;
        }

        .ar-btn-start:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Видеопоток камеры смартфона -->
    <video id="camera-video" autoplay playsinline muted></video>

    <!-- Скрытый канвас для обработки кадров компьютерного зрения -->
    <canvas id="processing-canvas"></canvas>

    <!-- 3D сцена для наложения оживающего контента -->
    <div id="ar-stage">
        <div id="ar-overlay-plane">
            <video id="ar-video-content" playsinline loop muted></video>
            <img id="ar-img-content" style="display:none;" alt="AR Content">
        </div>
    </div>

    <!-- HUD Интерфейс поверх камеры -->
    <div class="ar-hud">
        <div class="ar-header">
            <div class="brand-badge">
                <span>✨</span>
                <span>TRENDUM AR</span>
            </div>
            <button class="sound-btn" id="btn-sound-toggle" title="Включить звук">
                <svg id="sound-icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <svg id="sound-icon-on" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>

        <!-- Лазерная рамка сканирования -->
        <div class="ar-scanner-frame" id="scanner-frame">
            <div class="frame-corner corner-tl"></div>
            <div class="frame-corner corner-tr"></div>
            <div class="frame-corner corner-bl"></div>
            <div class="frame-corner corner-br"></div>
            <div class="scan-laser" id="scan-laser"></div>
            <div class="scan-hint" id="scan-hint">
                <span>🎯</span>
                <span>Наведите камеру на маркер</span>
            </div>
        </div>

        <div class="ar-bottom-bar">
            <div class="marker-preview-chip" id="marker-chip" style="display:none;">
                <img class="marker-thumb" id="marker-thumb-img" src="" alt="Маркер">
                <span>МАРКЕР АКТИВЕН</span>
            </div>
        </div>
    </div>

    <!-- Стартовый экран запроса камеры -->
    <div id="permission-screen">
        <div class="ar-start-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h20M12 2v20M7 7l10 10M17 7L7 17"/>
            </svg>
        </div>
        <h2 style="font-size:22px; font-weight:800; letter-spacing:1px; color:#fff;">ОЖИВАЮЩЕЕ ФОТО В AR</h2>
        <p style="font-size:14px; color:rgba(255,255,255,0.65); max-width:280px; line-height:1.5;">
            Разрешите доступ к камере, чтобы запустить просмотр дополненной реальности.
        </p>
        <button type="button" class="ar-btn-start" id="btn-start-ar">
            ВКЛЮЧИТЬ КАМЕРУ
        </button>
    </div>

    <script>
        (function() {
            const SUPABASE_URL    = 'https://pegkcclwtwxmngczcqtk.supabase.co';
            const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZ2tjY2x3dHd4bW5nY3pjcXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ3OTksImV4cCI6MjEwNDU0MDc5OX0.AR2bUswLEm5pJ4ORsfQiNqZMlvcp0b5LhZaMr0FtKew';
            const SUPABASE_BUCKET = 'kiosk-media';

            const params = new URLSearchParams(window.location.search);
            const arId = params.get('id') || params.get('orderId') || '';
            const directMarker = params.get('marker') || '';
            const directMedia  = params.get('media') || params.get('file') || '';

            const videoEl        = document.getElementById('camera-video');
            const procCanvas     = document.getElementById('processing-canvas');
            const procCtx        = procCanvas.getContext('2d', { willReadFrequently: true });
            const overlayPlane   = document.getElementById('ar-overlay-plane');
            const arVideo        = document.getElementById('ar-video-content');
            const arImg          = document.getElementById('ar-img-content');
            const scannerFrame   = document.getElementById('scanner-frame');
            const scanHint       = document.getElementById('scan-hint');
            const scanLaser      = document.getElementById('scan-laser');
            const markerChip     = document.getElementById('marker-chip');
            const markerThumbImg = document.getElementById('marker-thumb-img');
            const btnSound       = document.getElementById('btn-sound-toggle');
            const iconMuted      = document.getElementById('sound-icon-muted');
            const iconOn         = document.getElementById('sound-icon-on');
            const permScreen     = document.getElementById('permission-screen');
            const btnStartAr     = document.getElementById('btn-start-ar');

            let arConfig = {
                markerUrl: directMarker,
                mediaUrl: directMedia,
                isVideo: true
            };

            let cameraStream = null;
            let isRunning = false;
            let isMuted = true;
            let lastFoundTime = 0;
            let currentTransform = null;

            // 1. Загрузка параметров проекта из Supabase (если передан id)
            async function loadArConfig() {
                if (!arId) return;
                try {
                    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/ar/${arId}.json?_t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        arConfig.markerUrl = data.markerUrl || arConfig.markerUrl;
                        arConfig.mediaUrl  = data.mediaUrl || data.contentUrl || arConfig.mediaUrl;
                        arConfig.isVideo   = data.isVideo !== false && !arConfig.mediaUrl.match(/\.(jpg|jpeg|png|webp)$/i);
                    }
                } catch(e) {
                    console.warn('[AR] Не удалось загрузить манифест из Supabase:', e);
                }
            }

            // 2. Инициализация контента
            function setupOverlayMedia() {
                if (arConfig.markerUrl) {
                    markerThumbImg.src = arConfig.markerUrl;
                    markerChip.style.display = 'flex';
                }

                if (arConfig.mediaUrl) {
                    if (arConfig.isVideo) {
                        arVideo.src = arConfig.mediaUrl;
                        arVideo.style.display = 'block';
                        arImg.style.display = 'none';
                        arVideo.load();
                    } else {
                        arImg.src = arConfig.mediaUrl;
                        arImg.style.display = 'block';
                        arVideo.style.display = 'none';
                    }
                }
            }

            // 3. Запуск камеры
            async function startCamera() {
                try {
                    const constraints = {
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    };

                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoEl.srcObject = cameraStream;
                    await videoEl.play();

                    permScreen.style.display = 'none';
                    isRunning = true;
                    requestAnimationFrame(processFrame);
                } catch(err) {
                    alert('Не удалось запустить камеру. Пожалуйста, разрешите доступ к камере в браузере.');
                    console.error('Camera error:', err);
                }
            }

            // 4. Высокоскоростной цикл компьютерного зрения (QR / Marker Homography)
            function processFrame() {
                if (!isRunning) return;

                if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    const vw = videoEl.videoWidth;
                    const vh = videoEl.videoHeight;

                    // Уменьшаем разрешение для мгновенного детектирования (60 FPS без лагов)
                    const scale = 0.5;
                    procCanvas.width  = Math.floor(vw * scale);
                    procCanvas.height = Math.floor(vh * scale);

                    procCtx.drawImage(videoEl, 0, 0, procCanvas.width, procCanvas.height);
                    const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);

                    // Сканируем маркер через jsQR
                    const code = jsQR(imgData.data, imgData.width, imgData.height, {
                        inversionAttempts: "dontInvert"
                    });

                    if (code && code.location) {
                        lastFoundTime = performance.now();
                        applyMarkerTracking(code.location, scale);
                    } else {
                        // Плавное скрытие если маркер ушел из кадра более чем на 350мс
                        if (performance.now() - lastFoundTime > 350) {
                            hideOverlay();
                        }
                    }
                }

                requestAnimationFrame(processFrame);
            }

            // 5. Расчет перспективы и привязка к маркеру в 3D
            function applyMarkerTracking(loc, scale) {
                // Координаты углов на оригинальном видео
                const topLeft     = { x: loc.topLeftCorner.x / scale,     y: loc.topLeftCorner.y / scale };
                const topRight    = { x: loc.topRightCorner.x / scale,    y: loc.topRightCorner.y / scale };
                const bottomRight = { x: loc.bottomRightCorner.x / scale, y: loc.bottomRightCorner.y / scale };
                const bottomLeft  = { x: loc.bottomLeftCorner.x / scale,  y: loc.bottomLeftCorner.y / scale };

                // Вычисляем размеры экрана и масштабирование
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                const vidW = videoEl.videoWidth || 1280;
                const vidH = videoEl.videoHeight || 720;

                // Масштаб object-fit: cover
                const screenRatio = screenW / screenH;
                const vidRatio    = vidW / vidH;
                let renderW, renderH, offsetX, offsetY;

                if (screenRatio > vidRatio) {
                    renderW = screenW;
                    renderH = screenW / vidRatio;
                    offsetX = 0;
                    offsetY = (screenH - renderH) / 2;
                } else {
                    renderH = screenH;
                    renderW = screenH * vidRatio;
                    offsetX = (screenW - renderW) / 2;
                    offsetY = 0;
                }

                const toScreen = (pt) => ({
                    x: (pt.x / vidW) * renderW + offsetX,
                    y: (pt.y / vidH) * renderH + offsetY
                });

                const sTL = toScreen(topLeft);
                const sTR = toScreen(topRight);
                const sBR = toScreen(bottomRight);
                const sBL = toScreen(bottomLeft);

                // Ширина и высота маркера на экране
                const markerWidth  = Math.hypot(sTR.x - sTL.x, sTR.y - sTL.y);
                const markerHeight = Math.hypot(sBL.x - sTL.x, sBL.y - sTL.y);
                const angleRad     = Math.atan2(sTR.y - sTL.y, sTR.x - sTL.x);

                // Оверлей делаем чуть больше маркера для эффекта полного оживания
                const expand = 1.25;
                const targetW = markerWidth * expand;
                const targetH = markerHeight * expand;

                const centerX = (sTL.x + sTR.x + sBR.x + sBL.x) / 4;
                const centerY = (sTL.y + sTR.y + sBR.y + sBL.y) / 4;

                overlayPlane.style.display = 'block';
                overlayPlane.style.opacity = '1';
                overlayPlane.style.width   = `${targetW}px`;
                overlayPlane.style.height  = `${targetH}px`;
                overlayPlane.style.transform = `translate3d(${centerX - targetW/2}px, ${centerY - targetH/2}px, 0) rotate(${angleRad}rad)`;

                scannerFrame.classList.add('tracking-active');
                scanLaser.style.display = 'none';
                scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                if (arConfig.isVideo && arVideo.paused) {
                    arVideo.play().catch(() => {});
                }
            }

            function hideOverlay() {
                overlayPlane.style.opacity = '0';
                setTimeout(() => {
                    if (performance.now() - lastFoundTime > 350) {
                        overlayPlane.style.display = 'none';
                        if (arConfig.isVideo && !arVideo.paused) {
                            arVideo.pause();
                        }
                    }
                }, 200);

                scannerFrame.classList.remove('tracking-active');
                scanLaser.style.display = 'block';
                scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на маркер</span>';
            }

            // Управление звуком
            btnSound.addEventListener('click', () => {
                isMuted = !isMuted;
                arVideo.muted = isMuted;
                iconMuted.style.display = isMuted ? 'block' : 'none';
                iconOn.style.display = isMuted ? 'none' : 'block';
            });

            btnStartAr.addEventListener('click', () => {
                startCamera();
            });

            // Инициализация при открытии
            loadArConfig().then(setupOverlayMedia);

        })();
    </script>
</body>
</html>
