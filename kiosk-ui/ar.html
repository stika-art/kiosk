<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRENDUM — Дополненная реальность</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-glow: rgba(212, 160, 67, 0.4);
            --neon-blue: #00f2fe;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --bg: #0F0F12;
            --card-bg: rgba(24, 24, 29, 0.85);
            --text-main: #FFFFFF;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* ── Камера ── */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #processing-canvas, #check-canvas {
            display: none;
        }

        /* ── Сцена наложения AR ── */
        #ar-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #ar-overlay-plane {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
            box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            transition: opacity 0.25s ease, transform 0.15s ease-out;
            pointer-events: auto;
            background: #000;
        }

        #ar-video-content, #ar-img-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── HUD ── */
        .ar-hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            pointer-events: none;
        }

        .ar-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand-badge {
            background: rgba(15, 15, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .sound-btn {
            background: rgba(15, 15, 18, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* ── Лазерная рамка видоискателя ── */
        .ar-scanner-frame {
            position: relative;
            width: 270px;
            height: 270px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ar-scanner-frame.tracking-active {
            box-shadow: none;
            opacity: 0.1;
        }

        .frame-corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 4px solid var(--neon-blue);
            transition: border-color 0.2s;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 20px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

        .scan-laser {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scanLaserAnim 2s ease-in-out infinite;
        }

        @keyframes scanLaserAnim {
            0% { top: 12px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 255px; opacity: 0; }
        }

        .scan-hint {
            position: absolute;
            bottom: -56px;
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(12px);
            padding: 9px 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 242, 254, 0.4);
            font-size: 13.5px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* ── Кнопка прямого оживления ── */
        .manual-trigger-btn {
            position: absolute;
            bottom: -110px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 30px;
            padding: 10px 22px;
            color: #000;
            font-family: inherit;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .manual-trigger-btn:active {
            transform: scale(0.96);
        }

        .ar-bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .marker-preview-chip {
            background: rgba(24, 24, 29, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 50px;
            padding: 6px 16px 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .marker-thumb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--primary);
        }

        /* ── Экран запуска ── */
        #permission-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            gap: 20px;
        }

        .ar-start-icon {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.2) 0%, transparent 70%);
            border: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .ar-btn-start {
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            color: #000;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.15s;
        }
        .ar-btn-start:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="processing-canvas"></canvas>
    <canvas id="check-canvas"></canvas>

    <div id="ar-stage">
        <div id="ar-overlay-plane">
            <video id="ar-video-content" playsinline loop muted></video>
            <img id="ar-img-content" style="display:none;" alt="AR Content">
        </div>
    </div>

    <div class="ar-hud">
        <div class="ar-header">
            <div class="brand-badge">
                <span>✨</span>
                <span>TRENDUM AR</span>
            </div>
            <button class="sound-btn" id="btn-sound-toggle" title="Включить звук">
                <svg id="sound-icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <svg id="sound-icon-on" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>

        <!-- Лазерная рамка сканирования маркера -->
        <div class="ar-scanner-frame" id="scanner-frame" title="Нажмите для оживления">
            <div class="frame-corner corner-tl"></div>
            <div class="frame-corner corner-tr"></div>
            <div class="frame-corner corner-bl"></div>
            <div class="frame-corner corner-br"></div>
            <div class="scan-laser" id="scan-laser"></div>
            <div class="scan-hint" id="scan-hint">
                <span>🎯</span>
                <span>Наведите камеру на маркер</span>
            </div>
            <!-- Быстрая кнопка принудительного воспроизведения -->
            <button type="button" class="manual-trigger-btn" id="btn-manual-play">
                <span>▶️</span>
                <span>ОЖИВИТЬ СЕЙЧАС</span>
            </button>
        </div>

        <div class="ar-bottom-bar">
            <div class="marker-preview-chip" id="marker-chip" style="display:none;">
                <img class="marker-thumb" id="marker-thumb-img" src="" alt="Маркер">
                <span>МАРКЕР АКТИВЕН</span>
            </div>
        </div>
    </div>

    <!-- Стартовый экран запроса камеры -->
    <div id="permission-screen">
        <div class="ar-start-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h20M12 2v20M7 7l10 10M17 7L7 17"/>
            </svg>
        </div>
        <h2 style="font-size:22px; font-weight:800; letter-spacing:1px; color:#fff;">ОЖИВАЮЩЕЕ ФОТО В AR</h2>
        <p style="font-size:14px; color:rgba(255,255,255,0.65); max-width:280px; line-height:1.5;">
            Нажмите кнопку для запуска дополненной реальности со звуком.
        </p>
        <button type="button" class="ar-btn-start" id="btn-start-ar">
            ВКЛЮЧИТЬ КАМЕРУ
        </button>
    </div>

    <script>
        (function() {
            const SUPABASE_URL    = 'https://pegkcclwtwxmngczcqtk.supabase.co';
            const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZ2tjY2x3dHd4bW5nY3pjcXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ3OTksImV4cCI6MjEwNDU0MDc5OX0.AR2bUswLEm5pJ4ORsfQiNqZMlvcp0b5LhZaMr0FtKew';
            const SUPABASE_BUCKET = 'kiosk-media';

            const params = new URLSearchParams(window.location.search);
            const arId = params.get('id') || params.get('orderId') || '';
            const directMarker = params.get('marker') || '';
            const directMedia  = params.get('media') || params.get('file') || '';

            const videoEl        = document.getElementById('camera-video');
            const procCanvas     = document.getElementById('processing-canvas');
            const procCtx        = procCanvas.getContext('2d', { willReadFrequently: true });
            const checkCanvas    = document.getElementById('check-canvas');
            const checkCtx       = checkCanvas.getContext('2d', { willReadFrequently: true });
            const overlayPlane   = document.getElementById('ar-overlay-plane');
            const arVideo        = document.getElementById('ar-video-content');
            const arImg          = document.getElementById('ar-img-content');
            const scannerFrame   = document.getElementById('scanner-frame');
            const scanHint       = document.getElementById('scan-hint');
            const scanLaser      = document.getElementById('scan-laser');
            const markerChip     = document.getElementById('marker-chip');
            const markerThumbImg = document.getElementById('marker-thumb-img');
            const btnSound       = document.getElementById('btn-sound-toggle');
            const iconMuted      = document.getElementById('sound-icon-muted');
            const iconOn         = document.getElementById('sound-icon-on');
            const permScreen     = document.getElementById('permission-screen');
            const btnStartAr     = document.getElementById('btn-start-ar');
            const btnManualPlay  = document.getElementById('btn-manual-play');

            let arConfig = {
                markerUrl: directMarker,
                mediaUrl: directMedia,
                isVideo: true
            };

            let markerAnalysis = null;
            let markerLoadedImg = null;
            let cameraStream = null;
            let isRunning = false;
            let isMuted = true;
            let lastFoundTime = 0;
            let matchStreak = 0;
            let manualActive = false;

            // 1. Загрузка параметров проекта из Supabase
            async function loadArConfig() {
                if (!arId) return;
                try {
                    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/ar/${arId}.json?_t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        arConfig.markerUrl = data.markerUrl || arConfig.markerUrl;
                        arConfig.mediaUrl  = data.mediaUrl || data.contentUrl || arConfig.mediaUrl;
                        arConfig.isVideo   = data.isVideo !== false && !arConfig.mediaUrl.match(/\.(jpg|jpeg|png|webp)$/i);
                    }
                } catch(e) {
                    console.warn('[AR] Не удалось загрузить манифест из Supabase:', e);
                }
            }

            // 2. Инициализация контента и визуальный анализ маркера
            function setupOverlayMedia() {
                if (arConfig.markerUrl) {
                    markerThumbImg.src = arConfig.markerUrl;
                    markerChip.style.display = 'flex';

                    // Загружаем картинку-маркер для визуального анализа в памяти
                    markerLoadedImg = new Image();
                    markerLoadedImg.crossOrigin = 'anonymous';
                    markerLoadedImg.onload = () => {
                        markerAnalysis = analyzeImage(markerLoadedImg);
                        console.log('[AR] Маркер успешно проанализирован для визуального поиска');
                    };
                    markerLoadedImg.src = arConfig.markerUrl;
                }

                if (arConfig.mediaUrl) {
                    if (arConfig.isVideo) {
                        arVideo.src = arConfig.mediaUrl;
                        arVideo.style.display = 'block';
                        arImg.style.display = 'none';
                        arVideo.load();
                    } else {
                        arImg.src = arConfig.mediaUrl;
                        arImg.style.display = 'block';
                        arVideo.style.display = 'none';
                    }
                }
            }

            // Алгоритм анализа цветовой карты и яркости (32x32 блок)
            function analyzeImage(img) {
                const cv = document.createElement('canvas');
                cv.width = 32; cv.height = 32;
                const cx = cv.getContext('2d');
                cx.drawImage(img, 0, 0, 32, 32);
                const d = cx.getImageData(0, 0, 32, 32).data;
                const grays = new Float32Array(1024);
                let avgR = 0, avgG = 0, avgB = 0;
                for (let i = 0; i < 1024; i++) {
                    const r = d[i*4], g = d[i*4+1], b = d[i*4+2];
                    avgR += r; avgG += g; avgB += b;
                    grays[i] = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                }
                return {
                    grays,
                    avgR: avgR / 1024,
                    avgG: avgG / 1024,
                    avgB: avgB / 1024
                };
            }

            // 3. Запуск камеры
            async function startCamera() {
                try {
                    const constraints = {
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: false
                    };

                    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoEl.srcObject = cameraStream;
                    await videoEl.play();

                    permScreen.style.display = 'none';
                    isRunning = true;
                    requestAnimationFrame(processFrame);
                } catch(err) {
                    alert('Не удалось запустить камеру. Пожалуйста, разрешите доступ к камере в браузере.');
                    console.error('Camera error:', err);
                }
            }

            // 4. Высокоскоростной цикл компьютерного зрения (Visual Matching + QR)
            function processFrame() {
                if (!isRunning) return;

                if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    const vw = videoEl.videoWidth;
                    const vh = videoEl.videoHeight;

                    // А. ПРОВЕРКА 1: Визуальное сопоставление с картинкой в видоискателе
                    const isVisualMatch = checkVisualMatch(vw, vh);

                    // Б. ПРОВЕРКА 2: Сканирование QR-кода через jsQR
                    let qrCodeFound = null;
                    if (!isVisualMatch) {
                        const scale = 0.5;
                        procCanvas.width  = Math.floor(vw * scale);
                        procCanvas.height = Math.floor(vh * scale);
                        procCtx.drawImage(videoEl, 0, 0, procCanvas.width, procCanvas.height);
                        const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
                        qrCodeFound = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
                    }

                    if (isVisualMatch || manualActive) {
                        lastFoundTime = performance.now();
                        applyFrameTracking();
                    } else if (qrCodeFound && qrCodeFound.location) {
                        lastFoundTime = performance.now();
                        applyQrTracking(qrCodeFound.location, 0.5);
                    } else {
                        // Скрытие если маркер ушел из видоискателя
                        if (performance.now() - lastFoundTime > 500 && !manualActive) {
                            hideOverlay();
                        }
                    }
                }

                requestAnimationFrame(processFrame);
            }

            // Сравнение области видоискателя с фото-маркером
            function checkVisualMatch(vw, vh) {
                if (!markerAnalysis) return false;

                const frameRect = scannerFrame.getBoundingClientRect();
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;

                const screenRatio = screenW / screenH;
                const vidRatio    = vw / vh;
                let renderW, renderH, offsetX, offsetY;

                if (screenRatio > vidRatio) {
                    renderW = screenW; renderH = screenW / vidRatio;
                    offsetX = 0; offsetY = (screenH - renderH) / 2;
                } else {
                    renderH = screenH; renderW = screenH * vidRatio;
                    offsetX = (screenW - renderW) / 2; offsetY = 0;
                }

                const cropX = Math.max(0, Math.floor(((frameRect.left - offsetX) / renderW) * vw));
                const cropY = Math.max(0, Math.floor(((frameRect.top - offsetY) / renderH) * vh));
                const cropW = Math.min(vw - cropX, Math.floor((frameRect.width / renderW) * vw));
                const cropH = Math.min(vh - cropY, Math.floor((frameRect.height / renderH) * vh));

                if (cropW <= 20 || cropH <= 20) return false;

                checkCanvas.width = 32; checkCanvas.height = 32;
                checkCtx.drawImage(videoEl, cropX, cropY, cropW, cropH, 0, 0, 32, 32);
                const cd = checkCtx.getImageData(0, 0, 32, 32).data;

                let curAvgR = 0, curAvgG = 0, curAvgB = 0;
                let diffSum = 0;
                for (let i = 0; i < 1024; i++) {
                    const r = cd[i*4], g = cd[i*4+1], b = cd[i*4+2];
                    curAvgR += r; curAvgG += g; curAvgB += b;
                    const curGray = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    diffSum += Math.abs(curGray - markerAnalysis.grays[i]);
                }
                curAvgR /= 1024; curAvgG /= 1024; curAvgB /= 1024;

                const avgDiff = diffSum / 1024;
                const colorDiff = (Math.abs(curAvgR - markerAnalysis.avgR) +
                                   Math.abs(curAvgG - markerAnalysis.avgG) +
                                   Math.abs(curAvgB - markerAnalysis.avgB)) / (255 * 3);

                // Оценка схожести (от 0 до 1)
                const similarity = 1 - (avgDiff * 0.7 + colorDiff * 0.3);

                if (similarity > 0.60) {
                    matchStreak++;
                    return matchStreak >= 2;
                } else {
                    matchStreak = Math.max(0, matchStreak - 1);
                    return false;
                }
            }

            // Наложение видео точно поверх рамки видоискателя
            function applyFrameTracking() {
                const rect = scannerFrame.getBoundingClientRect();
                overlayPlane.style.display = 'block';
                overlayPlane.style.opacity = '1';
                overlayPlane.style.width   = `${rect.width}px`;
                overlayPlane.style.height  = `${rect.height}px`;
                overlayPlane.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;

                scannerFrame.classList.add('tracking-active');
                scanLaser.style.display = 'none';
                scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                if (arConfig.isVideo && arVideo.paused) {
                    arVideo.play().catch(e => console.warn('Video play:', e));
                }
            }

            // Наложение видео по QR-метке
            function applyQrTracking(loc, scale) {
                const sTL = { x: loc.topLeftCorner.x / scale, y: loc.topLeftCorner.y / scale };
                const sTR = { x: loc.topRightCorner.x / scale, y: loc.topRightCorner.y / scale };
                const sBL = { x: loc.bottomLeftCorner.x / scale, y: loc.bottomLeftCorner.y / scale };

                const screenW = window.innerWidth, screenH = window.innerHeight;
                const vidW = videoEl.videoWidth || 1280, vidH = videoEl.videoHeight || 720;

                const renderW = screenW;
                const renderH = screenW * (vidH / vidW);
                const offsetY = (screenH - renderH) / 2;

                const toScreen = (pt) => ({ x: (pt.x / vidW) * renderW, y: (pt.y / vidH) * renderH + offsetY });
                const pTL = toScreen(sTL);
                const pTR = toScreen(sTR);
                const pBL = toScreen(sBL);

                const targetW = Math.hypot(pTR.x - pTL.x, pTR.y - pTL.y) * 1.4;
                const targetH = Math.hypot(pBL.x - pTL.x, pBL.y - pTL.y) * 1.4;
                const angleRad = Math.atan2(pTR.y - pTL.y, pTR.x - pTL.x);

                overlayPlane.style.display = 'block';
                overlayPlane.style.opacity = '1';
                overlayPlane.style.width   = `${targetW}px`;
                overlayPlane.style.height  = `${targetH}px`;
                overlayPlane.style.transform = `translate3d(${pTL.x - targetW*0.1}px, ${pTL.y - targetH*0.1}px, 0) rotate(${angleRad}rad)`;

                scannerFrame.classList.add('tracking-active');
                scanLaser.style.display = 'none';
                scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                if (arConfig.isVideo && arVideo.paused) {
                    arVideo.play().catch(() => {});
                }
            }

            function hideOverlay() {
                overlayPlane.style.opacity = '0';
                setTimeout(() => {
                    if (performance.now() - lastFoundTime > 500 && !manualActive) {
                        overlayPlane.style.display = 'none';
                        if (arConfig.isVideo && !arVideo.paused) {
                            arVideo.pause();
                        }
                    }
                }, 250);

                scannerFrame.classList.remove('tracking-active');
                scanLaser.style.display = 'block';
                scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на маркер</span>';
            }

            // Прямой запуск по кнопке или тапу на видоискатель
            function triggerManualPlay() {
                manualActive = true;
                applyFrameTracking();
                if (arConfig.isVideo) {
                    arVideo.muted = false;
                    isMuted = false;
                    iconMuted.style.display = 'none';
                    iconOn.style.display = 'block';
                    arVideo.play().catch(e => console.warn(e));
                }
            }

            if (btnManualPlay) btnManualPlay.addEventListener('click', triggerManualPlay);
            if (scannerFrame)  scannerFrame.addEventListener('click', triggerManualPlay);

            // Управление звуком
            btnSound.addEventListener('click', () => {
                isMuted = !isMuted;
                arVideo.muted = isMuted;
                iconMuted.style.display = isMuted ? 'block' : 'none';
                iconOn.style.display = isMuted ? 'none' : 'block';
            });

            btnStartAr.addEventListener('click', () => {
                startCamera();
            });

            loadArConfig().then(setupOverlayMedia);

        })();
    </script>
</body>
</html>
