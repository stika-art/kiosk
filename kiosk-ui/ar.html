<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRENDUM — Дополненная реальность</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Движок A-Frame 1.4.2 и MindAR для настоящего 3D Natural Feature Tracking -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-glow: rgba(212, 160, 67, 0.4);
            --neon-blue: #00f2fe;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --bg: #0F0F12;
            --text-main: #FFFFFF;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* ── Полноэкранный WebAR контейнер A-Frame ── */
        #ar-scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ── Фолбэк видеопоток (для QR режима) ── */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        #qr-canvas {
            display: none;
        }

        /* 3D Плоскость для QR режима */
        #qr-overlay-plane {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
            box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            z-index: 5;
            pointer-events: none;
            background: #000;
        }

        #qr-video-player, #qr-img-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── HUD Интерфейс поверх WebAR ── */
        .ar-hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            pointer-events: none;
        }

        .ar-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand-badge {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .sound-btn {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* ── Лазерная рамка видоискателя сканера ── */
        .ar-scanner-frame {
            position: relative;
            width: 270px;
            height: 270px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .ar-scanner-frame.tracking-active {
            box-shadow: none;
            opacity: 0;
            pointer-events: none;
        }

        .frame-corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 4px solid var(--neon-blue);
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 20px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

        .scan-laser {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scanLaserAnim 2s ease-in-out infinite;
        }

        @keyframes scanLaserAnim {
            0% { top: 12px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 255px; opacity: 0; }
        }

        .scan-hint {
            position: absolute;
            bottom: -56px;
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(12px);
            padding: 9px 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 242, 254, 0.4);
            font-size: 13.5px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .ar-bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .marker-preview-chip {
            background: rgba(24, 24, 29, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 50px;
            padding: 6px 16px 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .marker-thumb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--primary);
        }

        /* ── Экран запуска ── */
        #permission-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            gap: 20px;
        }

        .ar-start-icon {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.2) 0%, transparent 70%);
            border: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .ar-btn-start {
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            color: #000;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.15s;
        }
        .ar-btn-start:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <!-- Контейнер для настоящей 3D WebAR сцены MindAR -->
    <div id="ar-scene-container"></div>


    <!-- HUD Поверх AR -->
    <div class="ar-hud">
        <div class="ar-header">
            <div class="brand-badge">
                <span>✨</span>
                <span>TRENDUM AR</span>
            </div>
            <button class="sound-btn" id="btn-sound-toggle" title="Включить звук">
                <svg id="sound-icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <svg id="sound-icon-on" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>

        <div class="ar-scanner-frame" id="scanner-frame">
            <div class="frame-corner corner-tl"></div>
            <div class="frame-corner corner-tr"></div>
            <div class="frame-corner corner-bl"></div>
            <div class="frame-corner corner-br"></div>
            <div class="scan-laser" id="scan-laser"></div>
            <div class="scan-hint" id="scan-hint">
                <span>🎯</span>
                <span>Наведите камеру на фото-маркер</span>
            </div>
        </div>

        <div class="ar-bottom-bar">
            <div class="marker-preview-chip" id="marker-chip" style="display:none;">
                <img class="marker-thumb" id="marker-thumb-img" src="" alt="Маркер">
                <span>МАРКЕР АКТИВЕН</span>
            </div>
        </div>
    </div>

    <!-- Стартовый экран запроса камеры -->
    <div id="permission-screen">
        <div class="ar-start-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h20M12 2v20M7 7l10 10M17 7L7 17"/>
            </svg>
        </div>
        <h2 style="font-size:22px; font-weight:800; letter-spacing:1px; color:#fff;">ОЖИВАЮЩЕЕ ФОТО В AR</h2>
        <p style="font-size:14px; color:rgba(255,255,255,0.65); max-width:280px; line-height:1.5;">
            Нажмите кнопку для запуска дополненной реальности. Наведите камеру на ваше фото.
        </p>
        <button type="button" class="ar-btn-start" id="btn-start-ar">
            ВКЛЮЧИТЬ КАМЕРУ
        </button>
    </div>

    <script>
        (function() {
            const SUPABASE_URL    = 'https://pegkcclwtwxmngczcqtk.supabase.co';
            const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZ2tjY2x3dHd4bW5nY3pjcXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ3OTksImV4cCI6MjEwNDU0MDc5OX0.AR2bUswLEm5pJ4ORsfQiNqZMlvcp0b5LhZaMr0FtKew';
            const SUPABASE_BUCKET = 'kiosk-media';

            const params = new URLSearchParams(window.location.search);
            const arId = params.get('id') || params.get('orderId') || '';
            const directMarker = params.get('marker') || '';
            const directMedia  = params.get('media') || params.get('file') || '';

            const sceneContainer = document.getElementById('ar-scene-container');
            const scannerFrame   = document.getElementById('scanner-frame');
            const scanHint       = document.getElementById('scan-hint');
            const markerChip     = document.getElementById('marker-chip');
            const markerThumbImg = document.getElementById('marker-thumb-img');
            const btnSound       = document.getElementById('btn-sound-toggle');
            const iconMuted      = document.getElementById('sound-icon-muted');
            const iconOn         = document.getElementById('sound-icon-on');
            const permScreen     = document.getElementById('permission-screen');
            const btnStartAr     = document.getElementById('btn-start-ar');

            let arConfig = {
                markerUrl: directMarker,
                mediaUrl: directMedia,
                mindUrl: '',
                isVideo: true,
                scale: 1.0,
                offsetX: 0,
                offsetY: 0
            };

            let markerAspect = 1.333; // отношение высоты к ширине
            let isMuted = false;
            let activeVideoEl = null;

            // 1. Загрузка параметров AR проекта
            async function loadArConfig() {
                if (arId) {
                    try {
                        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/ar/${arId}.json?_t=${Date.now()}`);
                        if (res.ok) {
                            const data = await res.json();
                            arConfig.markerUrl = data.markerUrl || arConfig.markerUrl;
                            arConfig.mediaUrl  = data.mediaUrl || data.contentUrl || arConfig.mediaUrl;
                            arConfig.mindUrl   = data.mindUrl || '';
                            arConfig.isVideo   = data.isVideo !== false && !arConfig.mediaUrl.match(/\.(jpg|jpeg|png|webp)$/i);
                            arConfig.scale     = Number(data.scale) || 1.0;
                            arConfig.offsetX   = Number(data.offsetX) || 0;
                            arConfig.offsetY   = Number(data.offsetY) || 0;
                        }
                    } catch(e) {
                        console.warn('[AR] Ошибка загрузки манифеста:', e);
                    }

                    // Если mindUrl не был в json, проверяем наличие target.mind в бакете
                    if (!arConfig.mindUrl) {
                        const testMindUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/ar/${arId}/target.mind`;
                        try {
                            const chk = await fetch(testMindUrl, { method: 'HEAD' });
                            if (chk.ok) {
                                arConfig.mindUrl = testMindUrl;
                            }
                        } catch(e) {}
                    }
                }

                // Загружаем миниатюру маркера и вычисляем пропорции
                if (arConfig.markerUrl) {
                    markerThumbImg.src = arConfig.markerUrl;
                    markerChip.style.display = 'flex';

                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        if (img.width > 0 && img.height > 0) {
                            markerAspect = img.height / img.width;
                        }
                    };
                    img.src = arConfig.markerUrl;
                }
            }

            // Компиляция маркера на клиенте (если mindUrl отсутствует)
            async function compileMarkerOnClient(markerImgUrl) {
                if (!window.MINDAR || !window.MINDAR.IMAGE || !window.MINDAR.IMAGE.Compiler) {
                    throw new Error('MindAR Compiler недоступен');
                }
                scanHint.innerHTML = '<span>⚡</span><span>Калибровка AR-трекера: 0%...</span>';
                
                const compiler = new window.MINDAR.IMAGE.Compiler();
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = markerImgUrl;
                await new Promise((res, rej) => {
                    img.onload = res;
                    img.onerror = () => rej(new Error('Не удалось загрузить фото маркера'));
                });

                if (img.width > 0 && img.height > 0) {
                    markerAspect = img.height / img.width;
                }

                await compiler.compileImageTargets([img], (p) => {
                    const pct = Math.round(p * 100);
                    scanHint.innerHTML = `<span>⚡</span><span>Калибровка AR-трекера: ${pct}%...</span>`;
                });

                const exportedBuffer = await compiler.exportData();
                const mindBlob = new Blob([exportedBuffer], { type: 'application/octet-stream' });
                const blobUrl = URL.createObjectURL(mindBlob);

                // Сохраняем в Supabase в фоне, чтобы в следующий раз не компилировать заново
                if (arId) {
                    (async () => {
                        try {
                            const mindPath = `ar/${arId}/target.mind`;
                            const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${mindPath}`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/octet-stream', 'x-upsert': 'true' },
                                body: mindBlob
                            });
                            if (up.ok) {
                                arConfig.mindUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${mindPath}`;
                                // Обновляем манифест
                                fetch(`${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/ar/${arId}.json`, {
                                    method: 'POST',
                                    headers: { 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'x-upsert': 'true' },
                                    body: JSON.stringify(arConfig)
                                }).catch(() => {});
                            }
                        } catch(e) {
                            console.warn('[MindAR] Фоновая выгрузка в облако:', e);
                        }
                    })();
                }

                return blobUrl;
            }

            // 2. Запуск AR сессии по кнопке пользователя
            async function initArSession() {
                permScreen.style.display = 'none';

                let targetMindSrc = arConfig.mindUrl;

                if (!targetMindSrc && arConfig.markerUrl) {
                    try {
                        targetMindSrc = await compileMarkerOnClient(arConfig.markerUrl);
                    } catch(err) {
                        console.error('[AR] Ошибка компиляции на клиенте:', err);
                        alert('Не удалось скомпилировать трекер маркера. Убедитесь в стабильности интернета.');
                        return;
                    }
                }

                if (!targetMindSrc) {
                    alert('Маркер AR не найден. Пожалуйста, откройте ссылку из QR-кода заказа.');
                    return;
                }

                initMindArScene(targetMindSrc);
            }

            // ── ЗАПУСК НАСТОЯЩЕГО 3D NATURAL FEATURE TRACKING (MindAR + A-Frame) ──
            function initMindArScene(mindSrc) {
                const userScale = arConfig.scale || 1.0;
                // Нормализация сдвига для 3D координат A-Frame
                const posX = (arConfig.offsetX / 160).toFixed(3);
                const posY = (-arConfig.offsetY / 160).toFixed(3);
                const planeW = (1.0 * userScale).toFixed(3);
                const planeH = (markerAspect * userScale).toFixed(3);

                scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на фото-маркер</span>';

                const sceneHtml = `
                    <a-scene 
                        id="mindar-scene"
                        mindar-image="imageTargetSrc: ${mindSrc}; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
                        embedded
                        color-space="sRGB" 
                        renderer="colorManagement: true, physicallyCorrectLights: true" 
                        vr-mode-ui="enabled: false" 
                        device-orientation-permission-ui="enabled: false">
                        
                        <a-assets timeout="12000">
                            ${arConfig.isVideo ? `
                                <video id="ar-main-video" src="${arConfig.mediaUrl}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
                            ` : `
                                <img id="ar-main-img" src="${arConfig.mediaUrl}" crossorigin="anonymous">
                            `}
                        </a-assets>

                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                        <a-entity mindar-image-target="targetIndex: 0" id="ar-target-entity">
                            ${arConfig.isVideo ? `
                                <a-video id="ar-video-mesh" src="#ar-main-video" position="${posX} ${posY} 0" width="${planeW}" height="${planeH}"></a-video>
                            ` : `
                                <a-plane id="ar-img-mesh" src="#ar-main-img" position="${posX} ${posY} 0" width="${planeW}" height="${planeH}"></a-plane>
                            `}
                        </a-entity>
                    </a-scene>
                `;

                sceneContainer.innerHTML = sceneHtml;

                const checkInterval = setInterval(() => {
                    const targetEntity = document.getElementById('ar-target-entity');
                    const videoElement = document.getElementById('ar-main-video');

                    if (targetEntity && (!arConfig.isVideo || videoElement)) {
                        clearInterval(checkInterval);
                        setupArTrackingEvents(targetEntity, videoElement);
                    }
                }, 100);

                setTimeout(() => clearInterval(checkInterval), 10000);
            }

            function setupArTrackingEvents(targetEntity, videoElement) {
                if (videoElement) {
                    activeVideoEl = videoElement;
                    videoElement.muted = isMuted;

                    // Предварительный прогрев видео для обхода блокировок iOS Safari / Chrome Android
                    videoElement.play().then(() => {
                        videoElement.pause();
                    }).catch(() => {
                        // Если браузер заблокировал звук, форсируем muted: true для гарантии автоплея
                        isMuted = true;
                        videoElement.muted = true;
                        iconMuted.style.display = 'block';
                        iconOn.style.display = 'none';
                    });
                }

                // 1. Событие: физический маркер найден в кадре камеры
                targetEntity.addEventListener('targetFound', () => {
                    console.log('[MindAR] ✨ Маркер распознан в кадре!');
                    scannerFrame.classList.add('tracking-active');
                    scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                    if (videoElement) {
                        videoElement.play().catch(e => {
                            console.warn('[Video] Play fallback:', e);
                            videoElement.muted = true;
                            isMuted = true;
                            iconMuted.style.display = 'block';
                            iconOn.style.display = 'none';
                            videoElement.play().catch(() => {});
                        });
                    }

                    if (navigator.vibrate) {
                        try { navigator.vibrate(60); } catch(e) {}
                    }
                });

                // 2. Событие: маркер вышел из поля зрения камеры
                targetEntity.addEventListener('targetLost', () => {
                    console.log('[MindAR] Маркер потерян');
                    scannerFrame.classList.remove('tracking-active');
                    scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на фото-маркер</span>';

                    if (videoElement && !videoElement.paused) {
                        videoElement.pause();
                    }
                });
            }

            // Управление звуком
            btnSound.addEventListener('click', () => {
                isMuted = !isMuted;
                if (activeVideoEl) {
                    activeVideoEl.muted = isMuted;
                    if (!isMuted && activeVideoEl.paused) {
                        activeVideoEl.play().catch(() => {});
                    }
                }
                iconMuted.style.display = isMuted ? 'block' : 'none';
                iconOn.style.display = isMuted ? 'none' : 'block';
            });

            btnStartAr.addEventListener('click', initArSession);
            loadArConfig();

        })();
    </script>
</body>
</html>
