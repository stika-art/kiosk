<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0F12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRENDUM — Дополненная реальность</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Движок A-Frame 1.4.2 и MindAR для настоящего 3D Natural Feature Tracking -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-glow: rgba(212, 160, 67, 0.4);
            --neon-blue: #00f2fe;
            --neon-glow: rgba(0, 242, 254, 0.5);
            --bg: #0F0F12;
            --text-main: #FFFFFF;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* ── Полноэкранный WebAR контейнер A-Frame ── */
        #ar-scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ── Фолбэк видеопоток (для QR режима) ── */
        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        #qr-canvas {
            display: none;
        }

        /* 3D Плоскость для QR режима */
        #qr-overlay-plane {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: none;
            box-shadow: 0 0 35px var(--neon-glow);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            z-index: 5;
            pointer-events: none;
            background: #000;
        }

        #qr-video-player, #qr-img-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── HUD Интерфейс поверх WebAR ── */
        .ar-hud {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 20px max(24px, env(safe-area-inset-bottom));
            z-index: 10;
            pointer-events: none;
        }

        .ar-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand-badge {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .sound-btn {
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* ── Лазерная рамка видоискателя сканера ── */
        .ar-scanner-frame {
            position: relative;
            width: 270px;
            height: 270px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .ar-scanner-frame.tracking-active {
            box-shadow: none;
            opacity: 0;
            pointer-events: none;
        }

        .frame-corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border: 4px solid var(--neon-blue);
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 20px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

        .scan-laser {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scanLaserAnim 2s ease-in-out infinite;
        }

        @keyframes scanLaserAnim {
            0% { top: 12px; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 255px; opacity: 0; }
        }

        .scan-hint {
            position: absolute;
            bottom: -56px;
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(12px);
            padding: 9px 20px;
            border-radius: 25px;
            border: 1px solid rgba(0, 242, 254, 0.4);
            font-size: 13.5px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .ar-bottom-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .marker-preview-chip {
            background: rgba(24, 24, 29, 0.9);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 160, 67, 0.4);
            border-radius: 50px;
            padding: 6px 16px 6px 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .marker-thumb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--primary);
        }

        /* ── Экран запуска ── */
        #permission-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            gap: 20px;
        }

        .ar-start-icon {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.2) 0%, transparent 70%);
            border: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .ar-btn-start {
            width: 100%;
            max-width: 280px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            color: #000;
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.15s;
        }
        .ar-btn-start:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <!-- Контейнер для настоящей 3D WebAR сцены MindAR -->
    <div id="ar-scene-container"></div>

    <!-- Резервный видеопоток и плоскость (для режима QR трекинга) -->
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="qr-canvas"></canvas>
    <div id="qr-overlay-plane">
        <video id="qr-video-player" playsinline loop muted></video>
        <img id="qr-img-player" style="display:none;" alt="QR Media">
    </div>

    <!-- HUD Поверх AR -->
    <div class="ar-hud">
        <div class="ar-header">
            <div class="brand-badge">
                <span>✨</span>
                <span>TRENDUM AR</span>
            </div>
            <button class="sound-btn" id="btn-sound-toggle" title="Включить звук">
                <svg id="sound-icon-muted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <svg id="sound-icon-on" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>

        <div class="ar-scanner-frame" id="scanner-frame">
            <div class="frame-corner corner-tl"></div>
            <div class="frame-corner corner-tr"></div>
            <div class="frame-corner corner-bl"></div>
            <div class="frame-corner corner-br"></div>
            <div class="scan-laser" id="scan-laser"></div>
            <div class="scan-hint" id="scan-hint">
                <span>🎯</span>
                <span>Наведите камеру на фото-маркер</span>
            </div>
        </div>

        <div class="ar-bottom-bar">
            <div class="marker-preview-chip" id="marker-chip" style="display:none;">
                <img class="marker-thumb" id="marker-thumb-img" src="" alt="Маркер">
                <span>МАРКЕР АКТИВЕН</span>
            </div>
        </div>
    </div>

    <!-- Стартовый экран запроса камеры -->
    <div id="permission-screen">
        <div class="ar-start-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h20M12 2v20M7 7l10 10M17 7L7 17"/>
            </svg>
        </div>
        <h2 style="font-size:22px; font-weight:800; letter-spacing:1px; color:#fff;">ОЖИВАЮЩЕЕ ФОТО В AR</h2>
        <p style="font-size:14px; color:rgba(255,255,255,0.65); max-width:280px; line-height:1.5;">
            Нажмите кнопку для запуска дополненной реальности. Наведите камеру на ваше фото.
        </p>
        <button type="button" class="ar-btn-start" id="btn-start-ar">
            ВКЛЮЧИТЬ КАМЕРУ
        </button>
    </div>

    <script>
        (function() {
            const SUPABASE_URL    = 'https://pegkcclwtwxmngczcqtk.supabase.co';
            const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZ2tjY2x3dHd4bW5nY3pjcXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ3OTksImV4cCI6MjEwNDU0MDc5OX0.AR2bUswLEm5pJ4ORsfQiNqZMlvcp0b5LhZaMr0FtKew';
            const SUPABASE_BUCKET = 'kiosk-media';

            const params = new URLSearchParams(window.location.search);
            const arId = params.get('id') || params.get('orderId') || '';
            const directMarker = params.get('marker') || '';
            const directMedia  = params.get('media') || params.get('file') || '';

            const sceneContainer = document.getElementById('ar-scene-container');
            const videoEl        = document.getElementById('camera-video');
            const qrCanvas       = document.getElementById('qr-canvas');
            const qrCtx          = qrCanvas.getContext('2d', { willReadFrequently: true });
            const qrPlane        = document.getElementById('qr-overlay-plane');
            const qrVid          = document.getElementById('qr-video-player');
            const qrImg          = document.getElementById('qr-img-player');
            const scannerFrame   = document.getElementById('scanner-frame');
            const scanHint       = document.getElementById('scan-hint');
            const markerChip     = document.getElementById('marker-chip');
            const markerThumbImg = document.getElementById('marker-thumb-img');
            const btnSound       = document.getElementById('btn-sound-toggle');
            const iconMuted      = document.getElementById('sound-icon-muted');
            const iconOn         = document.getElementById('sound-icon-on');
            const permScreen     = document.getElementById('permission-screen');
            const btnStartAr     = document.getElementById('btn-start-ar');

            let arConfig = {
                markerUrl: directMarker,
                mediaUrl: directMedia,
                mindUrl: '',
                isVideo: true,
                scale: 1.0,
                offsetX: 0,
                offsetY: 0
            };

            let isMuted = false;
            let activeVideoEl = null;

            // 1. Загрузка параметров проекта
            async function loadArConfig() {
                if (!arId) return;
                try {
                    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/ar/${arId}.json?_t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        arConfig.markerUrl = data.markerUrl || arConfig.markerUrl;
                        arConfig.mediaUrl  = data.mediaUrl || data.contentUrl || arConfig.mediaUrl;
                        arConfig.mindUrl   = data.mindUrl || '';
                        arConfig.isVideo   = data.isVideo !== false && !arConfig.mediaUrl.match(/\.(jpg|jpeg|png|webp)$/i);
                        arConfig.scale     = Number(data.scale) || 1.0;
                        arConfig.offsetX   = Number(data.offsetX) || 0;
                        arConfig.offsetY   = Number(data.offsetY) || 0;
                    }
                } catch(e) {
                    console.warn('[AR] Ошибка загрузки манифеста:', e);
                }

                if (arConfig.markerUrl) {
                    markerThumbImg.src = arConfig.markerUrl;
                    markerChip.style.display = 'flex';
                }
            }

            // 2. Запуск AR после нажатия кнопки
            async function initArSession() {
                permScreen.style.display = 'none';

                // Если есть скомпилированный 3D маркер MindAR — запускаем настоящий MindAR
                if (arConfig.mindUrl) {
                    initMindArScene();
                } else {
                    // Фолбэк: QR-гомография
                    initQrTracking();
                }
            }

            // ── РЕЖИМ 1: НАСТОЯЩИЙ MINDAR 3D NATURAL FEATURE TRACKING ──
            function initMindArScene() {
                const userScale = arConfig.scale || 1.0;
                // Нормализация сдвига для 3D координат A-Frame (где ширина маркера = 1 метр)
                const posX = (arConfig.offsetX / 160).toFixed(3);
                const posY = (-arConfig.offsetY / 160).toFixed(3);
                const planeW = (1.0 * userScale).toFixed(3);
                const planeH = (1.0 * userScale).toFixed(3);

                const sceneHtml = `
                    <a-scene 
                        id="mindar-scene"
                        mindar-image="imageTargetSrc: ${arConfig.mindUrl}; autoStart: true; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01;" 
                        embedded
                        color-space="sRGB" 
                        renderer="colorManagement: true, physicallyCorrectLights: true" 
                        vr-mode-ui="enabled: false" 
                        device-orientation-permission-ui="enabled: false">
                        
                        <a-assets>
                            ${arConfig.isVideo ? `
                                <video id="ar-main-video" src="${arConfig.mediaUrl}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
                            ` : ''}
                        </a-assets>

                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                        <a-entity mindar-image-target="targetIndex: 0" id="ar-target-entity">
                            ${arConfig.isVideo ? `
                                <a-plane id="ar-plane" src="#ar-main-video" position="${posX} ${posY} 0" width="${planeW}" height="${planeH}" rotation="0 0 0"></a-plane>
                            ` : `
                                <a-plane id="ar-plane" src="${arConfig.mediaUrl}" position="${posX} ${posY} 0" width="${planeW}" height="${planeH}" rotation="0 0 0"></a-plane>
                            `}
                        </a-entity>
                    </a-scene>
                `;

                sceneContainer.innerHTML = sceneHtml;

                setTimeout(() => {
                    const targetEntity = document.getElementById('ar-target-entity');
                    const videoEl = document.getElementById('ar-main-video');
                    activeVideoEl = videoEl;

                    if (videoEl) {
                        videoEl.muted = isMuted;
                    }

                    if (targetEntity) {
                        // 1. Событие: маркер обнаружен в пространстве
                        targetEntity.addEventListener('targetFound', () => {
                            console.log('[MindAR] ✨ Маркер найден в кадре!');
                            scannerFrame.classList.add('tracking-active');
                            scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                            if (videoEl && videoEl.paused) {
                                videoEl.play().catch(e => console.warn('Play error:', e));
                            }
                            if (navigator.vibrate) {
                                try { navigator.vibrate(60); } catch(e) {}
                            }
                        });

                        // 2. Событие: маркер вышел из кадра
                        targetEntity.addEventListener('targetLost', () => {
                            console.log('[MindAR] Маркер потерян');
                            scannerFrame.classList.remove('tracking-active');
                            scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на фото-маркер</span>';

                            if (videoEl && !videoEl.paused) {
                                videoEl.pause();
                            }
                        });
                    }
                }, 300);
            }

            // ── РЕЖИМ 2: QR SPATIAL HOMOGRAPHY (0% ЛОЖНЫХ СРАБАТЫВАНИЙ) ──
            async function initQrTracking() {
                videoEl.style.display = 'block';

                if (arConfig.isVideo) {
                    qrVid.src = arConfig.mediaUrl;
                    qrVid.style.display = 'block';
                    qrImg.style.display = 'none';
                    activeVideoEl = qrVid;
                    qrVid.muted = isMuted;
                    qrVid.load();
                } else {
                    qrImg.src = arConfig.mediaUrl;
                    qrImg.style.display = 'block';
                    qrVid.style.display = 'none';
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    videoEl.srcObject = stream;
                    await videoEl.play();
                    requestAnimationFrame(qrLoop);
                } catch(e) {
                    alert('Не удалось запустить камеру');
                }
            }

            let lastQrFound = 0;
            function qrLoop() {
                if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    const vw = videoEl.videoWidth;
                    const vh = videoEl.videoHeight;
                    const scale = 0.5;

                    qrCanvas.width  = Math.floor(vw * scale);
                    qrCanvas.height = Math.floor(vh * scale);
                    qrCtx.drawImage(videoEl, 0, 0, qrCanvas.width, qrCanvas.height);
                    const imgData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);

                    // Ищем настоящий QR-код
                    const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

                    if (code && code.location) {
                        lastQrFound = performance.now();
                        applyQrHomography(code.location, scale);
                    } else {
                        // Если QR вышел из кадра — мгновенно скрываем! Никакого летания по экрану!
                        if (performance.now() - lastQrFound > 250) {
                            qrPlane.style.display = 'none';
                            scannerFrame.classList.remove('tracking-active');
                            scanHint.innerHTML = '<span>🎯</span><span>Наведите камеру на маркер</span>';
                            if (qrVid && !qrVid.paused) qrVid.pause();
                        }
                    }
                }
                requestAnimationFrame(qrLoop);
            }

            function applyQrHomography(loc, scale) {
                const sTL = { x: loc.topLeftCorner.x / scale, y: loc.topLeftCorner.y / scale };
                const sTR = { x: loc.topRightCorner.x / scale, y: loc.topRightCorner.y / scale };
                const sBL = { x: loc.bottomLeftCorner.x / scale, y: loc.bottomLeftCorner.y / scale };

                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                const vidW = videoEl.videoWidth || 1280;
                const vidH = videoEl.videoHeight || 720;

                const renderW = screenW;
                const renderH = screenW * (vidH / vidW);
                const offsetY = (screenH - renderH) / 2;

                const toScreen = (pt) => ({ x: (pt.x / vidW) * renderW, y: (pt.y / vidH) * renderH + offsetY });
                const pTL = toScreen(sTL);
                const pTR = toScreen(sTR);
                const pBL = toScreen(sBL);

                const userScale = arConfig.scale || 1.0;
                const userOffX  = arConfig.offsetX || 0;
                const userOffY  = arConfig.offsetY || 0;

                const baseW = Math.hypot(pTR.x - pTL.x, pTR.y - pTL.y) * 1.5;
                const baseH = Math.hypot(pBL.x - pTL.x, pBL.y - pTL.y) * 1.5;
                const angleRad = Math.atan2(pTR.y - pTL.y, pTR.x - pTL.x);

                const finalW = baseW * userScale;
                const finalH = baseH * userScale;

                qrPlane.style.display = 'block';
                qrPlane.style.width   = `${finalW}px`;
                qrPlane.style.height  = `${finalH}px`;
                qrPlane.style.transform = `translate3d(${pTL.x + userOffX}px, ${pTL.y + userOffY}px, 0) rotate(${angleRad}rad)`;

                scannerFrame.classList.add('tracking-active');
                scanHint.innerHTML = '<span>✨</span><span>ОЖИВАНИЕ АКТИВНО!</span>';

                if (arConfig.isVideo && qrVid && qrVid.paused) {
                    qrVid.play().catch(() => {});
                }
            }

            // Управление звуком
            btnSound.addEventListener('click', () => {
                isMuted = !isMuted;
                if (activeVideoEl) activeVideoEl.muted = isMuted;
                iconMuted.style.display = isMuted ? 'block' : 'none';
                iconOn.style.display = isMuted ? 'none' : 'block';
            });

            btnStartAr.addEventListener('click', initArSession);
            loadArConfig();

        })();
    </script>
</body>
</html>
