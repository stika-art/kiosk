<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#141414">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRENDUM — Камера с телефона</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #D4A043; --bg: #141414; --text: #FFFFFF; --muted: rgba(255,255,255,0.55); }
        html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: "Outfit", -apple-system, sans-serif; overflow: hidden; }
        #screen-cam, #screen-preview, #screen-success, #screen-error { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; }
        #screen-cam.active, #screen-preview.active, #screen-success.active, #screen-error.active { display: flex; }
        #video-preview { width: 100%; flex: 1; object-fit: cover; background: #000; }
        .cam-header { width: 100%; padding: 18px 20px 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); display: flex; align-items: center; justify-content: space-between; position: absolute; top: 0; z-index: 10; }
        .cam-logo { font-size: 15px; font-weight: 800; letter-spacing: 3px; color: var(--primary); }
        .cam-flip-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .cam-bottom-bar { position: absolute; bottom: 0; width: 100%; padding: 24px 20px max(24px, env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.9) 60%, transparent); display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 10; }
        .cam-hint { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; }
        #snap-phone-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--primary); border: 4px solid rgba(255,255,255,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, opacity 0.12s; -webkit-tap-highlight-color: transparent; box-shadow: 0 0 0 4px rgba(212,160,67,0.25), 0 8px 24px rgba(0,0,0,0.6); }
        #snap-phone-btn:active { transform: scale(0.9); opacity: 0.8; }
        #screen-preview { justify-content: center; }
        #captured-img { width: 100%; max-height: 65vh; object-fit: contain; background: #000; }
        .preview-actions { width: 100%; padding: 22px 20px max(20px, env(safe-area-inset-bottom)); display: flex; gap: 12px; justify-content: center; }
        .btn-retake, .btn-send { flex: 1; max-width: 180px; padding: 16px 0; border-radius: 50px; border: none; font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
        .btn-retake { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.2); color: #fff; }
        .btn-send { background: var(--primary); color: #000; }
        .preview-title { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; color: var(--primary); padding: 20px; text-align: center; }
        #screen-success { justify-content: center; gap: 20px; padding: 40px 30px; text-align: center; }
        .success-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(212,160,67,0.12); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; }
        .success-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--primary); }
        .success-sub { font-size: 15px; color: var(--muted); line-height: 1.6; }
        #screen-error { justify-content: center; gap: 20px; padding: 40px 30px; text-align: center; }
        .error-title { font-size: 18px; font-weight: 700; color: #FF6B6B; letter-spacing: 1.5px; }
        .error-sub { font-size: 14px; color: var(--muted); }
        #upload-progress { font-size: 14px; color: var(--muted); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="screen-cam" class="active">
    <video id="video-preview" autoplay playsinline muted></video>
    <div class="cam-header">
        <span class="cam-logo">TRENDUM</span>
        <button class="cam-flip-btn" id="flip-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        </button>
    </div>
    <div class="cam-bottom-bar">
        <div class="cam-hint">Нажмите кнопку, чтобы сделать снимок</div>
        <button id="snap-phone-btn">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="10" stroke-opacity="0.5"/></svg>
        </button>
    </div>
</div>

<div id="screen-preview">
    <div class="preview-title">ВАШ СНИМОК</div>
    <img id="captured-img" src="" alt="Снимок">
    <div class="preview-actions">
        <button class="btn-retake" id="btn-retake">ПЕРЕСНЯТЬ</button>
        <button class="btn-send" id="btn-send">ОТПРАВИТЬ</button>
    </div>
    <div id="upload-progress" style="display:none;">Отправка на киоск...</div>
</div>

<div id="screen-success">
    <div class="success-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D4A043" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">ФОТО ОТПРАВЛЕНО!</div>
    <p class="success-sub">Ваш снимок появится на экране киоска.<br>Подойдите к киоску для подтверждения.</p>
</div>

<div id="screen-error">
    <div class="error-title">ОШИБКА ОТПРАВКИ</div>
    <p class="error-sub" id="error-msg">Не удалось загрузить фото. Проверьте интернет и попробуйте снова.</p>
    <button class="btn-send" id="btn-retry" style="max-width:200px;margin-top:10px;">ПОПРОБОВАТЬ СНОВА</button>
</div>

<script>
    const SUPABASE_URL    = 'https://pegkcclwtwxmngczcqtk.supabase.co';
    const SUPABASE_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlZ2tjY2x3dHd4bW5nY3pjcXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ3OTksImV4cCI6MjEwNDU0MDc5OX0.AR2bUswLEm5pJ4ORsfQiNqZMlvcp0b5LhZaMr0FtKew';
    const SUPABASE_BUCKET = 'kiosk-media';

    const urlParams = new URLSearchParams(location.search);
    const sessionId = urlParams.get('session');

    let stream = null;
    let facingMode = 'user';
    let capturedBlob = null;

    if (!sessionId) {
        showScreen('screen-error');
        document.getElementById('error-msg').textContent = 'Неверная ссылка. QR-код истёк или недействителен.';
    }

    function showScreen(id) {
        ['screen-cam','screen-preview','screen-success','screen-error'].forEach(s => {
            document.getElementById(s).classList.toggle('active', s === id);
        });
    }

    async function startCamera(mode) {
        facingMode = mode || 'user';
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            document.getElementById('video-preview').srcObject = stream;
        } catch(e) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('video-preview').srcObject = stream;
            } catch(e2) {
                showScreen('screen-error');
                document.getElementById('error-msg').textContent = 'Нет доступа к камере. Разрешите доступ в браузере.';
            }
        }
    }

    function takeSnapshot() {
        const video = document.getElementById('video-preview');
        const canvas = document.createElement('canvas');
        const W = video.videoWidth || 1280, H = video.videoHeight || 720;
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        if (facingMode === 'user') { ctx.translate(W, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, 0, 0, W, H);
        canvas.toBlob(blob => {
            capturedBlob = blob;
            document.getElementById('captured-img').src = canvas.toDataURL('image/jpeg', 0.88);
            showScreen('screen-preview');
        }, 'image/jpeg', 0.88);
    }

    async function uploadPhoto() {
        if (!capturedBlob || !sessionId) return;
        const sendBtn    = document.getElementById('btn-send');
        const retakeBtn  = document.getElementById('btn-retake');
        const progressEl = document.getElementById('upload-progress');
        sendBtn.disabled = retakeBtn.disabled = true;
        progressEl.style.display = 'block';
        try {
            const res = await fetch(
                SUPABASE_URL + '/storage/v1/object/' + SUPABASE_BUCKET + '/phone-cam/' + sessionId + '.jpg',
                {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
                    body: capturedBlob
                }
            );
            if (res.ok || res.status === 200 || res.status === 201) {
                showScreen('screen-success');
            } else {
                throw new Error(String(res.status));
            }
        } catch(e) {
            console.error('Upload failed:', e);
            sendBtn.disabled = retakeBtn.disabled = false;
            progressEl.style.display = 'none';
            showScreen('screen-error');
        }
    }

    document.getElementById('snap-phone-btn').addEventListener('click', takeSnapshot);
    document.getElementById('flip-btn').addEventListener('click', () => startCamera(facingMode === 'user' ? 'environment' : 'user'));
    document.getElementById('btn-retake').addEventListener('click', () => { capturedBlob = null; showScreen('screen-cam'); });
    document.getElementById('btn-send').addEventListener('click', uploadPhoto);
    document.getElementById('btn-retry').addEventListener('click', () => { capturedBlob = null; showScreen('screen-cam'); });

    // Скрываем адресную строку (fullscreen) при первом касании пользователя
    let fullscreenRequested = false;
    function tryFullscreen() {
        if (fullscreenRequested) return;
        fullscreenRequested = true;
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (req) req.call(el).catch(() => {});
    }
    document.addEventListener('touchstart', tryFullscreen, { once: true });
    document.addEventListener('click', tryFullscreen, { once: true });

    if (sessionId) startCamera('user');
</script>
</body>
</html>
