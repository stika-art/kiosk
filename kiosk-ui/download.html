<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRENDUM — Ваше фото</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-hover: #F3D289;
            --primary-glow: rgba(212, 160, 67, 0.35);
            --bg-dark: #0F0F12;
            --card-bg: #18181D;
            --border: rgba(212, 160, 67, 0.25);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 18px 40px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 160, 67, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(20, 20, 28, 0.8) 0%, transparent 70%);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--primary);
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .media-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 160, 67, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
        }

        .media-preview-box {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 380px;
        }

        .media-preview-box img,
        .media-preview-box video {
            width: 100%;
            height: auto;
            max-height: 65vh;
            object-fit: contain;
            display: block;
        }

        .actions {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-main {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #D4A043 0%, #F3D289 100%);
            border: none;
            border-radius: 16px;
            color: #121214;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-sub {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-sub:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Карточка бутика / локации примерки */
        .boutique-card {
            width: 100%;
            max-width: 440px;
            background: rgba(212, 160, 67, 0.08);
            border: 1px solid rgba(212, 160, 67, 0.3);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: none;
        }

        .boutique-header {
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .boutique-title {
            font-size: 16px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 4px;
        }

        .boutique-loc {
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .boutique-price {
            margin-top: 8px;
            font-size: 18px;
            font-weight: 900;
            color: var(--primary);
        }

        .footer {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            margin-top: auto;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 160, 67, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Аудио-режим ── */
        .audio-box {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 16px 8px 8px;
            gap: 14px;
        }

        .audio-cover {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.4);
        }

        .audio-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            letter-spacing: 1px;
        }

        .audio-genre {
            font-size: 12px;
            color: rgba(168, 85, 247, 0.9);
            text-align: center;
            font-weight: 600;
        }

        audio#dl-audio-player {
            width: 100%;
            border-radius: 12px;
            outline: none;
        }

        .audio-variants {
            display: none;
            gap: 10px;
            width: 100%;
        }

        .audio-var-btn {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            background: transparent;
            color: #aaa;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .audio-var-btn.active {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            border-color: transparent;
        }

        .btn-music {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand-logo">TRENDUM</div>
        <div class="brand-sub" id="page-subtitle">Ваш кадр готов</div>
    </div>

    <div class="media-card">
        <div class="media-preview-box" id="media-box">
            <div class="loading-spinner" id="loader"></div>
            <img id="photo-el" style="display: none;" alt="TRENDUM Photo">
            <video id="video-el" style="display: none;" playsinline autoplay loop muted controls></video>
        </div>

        <!-- Аудио-блок (показывается при mode=audio) -->
        <div class="audio-box" id="audio-box">
            <img class="audio-cover" id="dl-audio-cover" src="" alt="Обложка">
            <div class="audio-title" id="dl-audio-title">ВАШ ПЕРСОНАЛЬНЫЙ ТРЕК</div>
            <div class="audio-genre" id="dl-audio-genre">🎵 Suno AI • Персональный хит</div>
            <audio id="dl-audio-player" controls></audio>
            <div class="audio-variants" id="dl-audio-variants">
                <button class="audio-var-btn active" id="dl-btn-var1">🎵 ВАРИАНТ 1</button>
                <button class="audio-var-btn" id="dl-btn-var2">🎵 ВАРИАНТ 2</button>
            </div>
        </div>
    </div>

    <!-- Карточка бутика (если передана в ссылке) -->
    <div class="boutique-card" id="boutique-card">
        <div class="boutique-header">ГДЕ ПРИМЕРИТЬ И КУПИТЬ</div>
        <div class="boutique-title" id="boutique-title">Товар из каталога</div>
        <div class="boutique-loc">
            <span>📍</span>
            <span id="boutique-loc">Уточняйте у консультанта</span>
        </div>
        <div class="boutique-price" id="boutique-price"></div>
    </div>

    <div class="actions" id="actions-box">
        <button type="button" class="btn-main" id="btn-download">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="btn-download-text">СКАЧАТЬ В ГАЛЕРЕЮ</span>
        </button>

        <!-- Кнопка скачивания второго варианта — только для музыки -->
        <button type="button" class="btn-main btn-music" id="btn-download2" style="display:none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="btn-download2-text">СКАЧАТЬ ВАРИАНТ 2</span>
        </button>

        <button type="button" class="btn-sub" id="btn-share">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>ПОДЕЛИТЬСЯ</span>
        </button>
    </div>

    <div class="footer">TRENDUM PHOTO KIOSK • ЧИСТОЕ КАЧЕСТВО</div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl  = params.get('file') || params.get('url') || '';
            const file2Url = params.get('file2') || '';
            const mode     = params.get('mode') || '';
            const title    = params.get('title') || '';
            const loc      = params.get('loc') || '';
            const price    = params.get('price') || '';

            const loader       = document.getElementById('loader');
            const mediaBox     = document.getElementById('media-box');
            const photoEl      = document.getElementById('photo-el');
            const videoEl      = document.getElementById('video-el');
            const audioBox     = document.getElementById('audio-box');
            const btnDownload  = document.getElementById('btn-download');
            const btnDownloadText = document.getElementById('btn-download-text');
            const btnDownload2 = document.getElementById('btn-download2');
            const btnDownload2Text = document.getElementById('btn-download2-text');
            const btnShare     = document.getElementById('btn-share');
            const boutiqueCard = document.getElementById('boutique-card');

            if (loc || price || title) {
                if (title) document.getElementById('boutique-title').textContent = title;
                if (loc)   document.getElementById('boutique-loc').textContent = loc;
                if (price) document.getElementById('boutique-price').textContent = `${price} СОМ`;
                boutiqueCard.style.display = 'block';
            }

            if (!fileUrl) {
                loader.style.display = 'none';
                document.getElementById('page-subtitle').textContent = 'Ссылка на файл не найдена';
                return;
            }

            // Определяем тип файла
            const isAudio = mode === 'audio' ||
                fileUrl.includes('.mp3') || fileUrl.includes('.wav') || fileUrl.includes('.m4a') ||
                fileUrl.includes('/audio/') || fileUrl.includes('suno');
            const isVideo = !isAudio && (fileUrl.includes('.mp4') || fileUrl.includes('.webm') || fileUrl.includes('/video/'));

            if (isAudio) {
                // ── Аудио-режим ──
                document.getElementById('page-subtitle').textContent = 'Ваш трек готов 🎵';
                mediaBox.style.display = 'none';
                loader.style.display = 'none';
                audioBox.style.display = 'flex';

                const audioPlayer    = document.getElementById('dl-audio-player');
                const audioCover     = document.getElementById('dl-audio-cover');
                const audioTitle     = document.getElementById('dl-audio-title');
                const audioGenre     = document.getElementById('dl-audio-genre');
                const variantsBox    = document.getElementById('dl-audio-variants');
                const btnVar1        = document.getElementById('dl-btn-var1');
                const btnVar2        = document.getElementById('dl-btn-var2');

                // URL первого варианта — из file, второго — из file2
                const tracks = [fileUrl];
                if (file2Url) tracks.push(file2Url);

                // Название трека
                if (title) audioTitle.textContent = title;
                if (title) audioGenre.textContent = `🎵 Suno AI • ${title}`;

                // Установить активный трек
                let activeIdx = 0;
                function setTrack(idx) {
                    activeIdx = idx;
                    audioPlayer.src = tracks[idx];
                    audioPlayer.play().catch(() => {});
                    btnVar1.classList.toggle('active', idx === 0);
                    btnVar2.classList.toggle('active', idx === 1);
                }

                audioPlayer.src = tracks[0];

                if (tracks.length >= 2) {
                    variantsBox.style.display = 'flex';
                    btnVar1.onclick = () => setTrack(0);
                    btnVar2.onclick = () => setTrack(1);
                    // Кнопка скачать вариант 1
                    btnDownloadText.textContent = 'СКАЧАТЬ ВАРИАНТ 1 🎵';
                    // Кнопка скачать вариант 2
                    btnDownload2.style.display = 'flex';
                }

                // Скачивание MP3
                async function downloadTrack(url, filename, btnText) {
                    const orig = btnText.textContent;
                    btnText.textContent = '⏳ СОХРАНЕНИЕ...';
                    try {
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('Fetch failed');
                        const blob = await resp.blob();
                        const objectUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = objectUrl;
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
                        btnText.textContent = '✅ СОХРАНЕНО!';
                        setTimeout(() => { btnText.textContent = orig; }, 2500);
                    } catch(e) {
                        window.location.href = url;
                        btnText.textContent = orig;
                    }
                }

                btnDownload.addEventListener('click', () => downloadTrack(tracks[0], 'TRENDUM_TRACK_1.mp3', btnDownloadText));
                btnDownload2.addEventListener('click', () => downloadTrack(tracks[1], 'TRENDUM_TRACK_2.mp3', btnDownload2Text));

            } else if (isVideo) {
                // ── Видео-режим ──
                videoEl.src = fileUrl;
                videoEl.onloadeddata = () => {
                    loader.style.display = 'none';
                    videoEl.style.display = 'block';
                };
                videoEl.onerror = () => {
                    loader.style.display = 'none';
                    videoEl.style.display = 'block';
                };

                async function triggerDownload() {
                    const orig = btnDownloadText.textContent;
                    btnDownloadText.textContent = '⏳ СОХРАНЕНИЕ...';
                    try {
                        const resp = await fetch(fileUrl);
                        if (!resp.ok) throw new Error('Fetch failed');
                        const blob = await resp.blob();
                        const objectUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = objectUrl;
                        link.download = 'TRENDUM_VIDEO.mp4';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
                        btnDownloadText.textContent = '✅ СОХРАНЕНО!';
                        setTimeout(() => { btnDownloadText.textContent = orig; }, 2500);
                    } catch(e) {
                        window.location.href = fileUrl;
                        btnDownloadText.textContent = orig;
                    }
                }
                btnDownload.addEventListener('click', triggerDownload);

            } else {
                // ── Фото-режим ──
                photoEl.src = fileUrl;
                photoEl.onload = () => {
                    loader.style.display = 'none';
                    photoEl.style.display = 'block';
                };
                photoEl.onerror = () => {
                    loader.style.display = 'none';
                    photoEl.style.display = 'block';
                };

                async function triggerDownload() {
                    const orig = btnDownloadText.textContent;
                    btnDownloadText.textContent = '⏳ СОХРАНЕНИЕ...';
                    try {
                        const resp = await fetch(fileUrl);
                        if (!resp.ok) throw new Error('Fetch failed');
                        const blob = await resp.blob();
                        const objectUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = objectUrl;
                        link.download = 'TRENDUM_PHOTO.jpg';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
                        btnDownloadText.textContent = '✅ СОХРАНЕНО!';
                        setTimeout(() => { btnDownloadText.textContent = orig; }, 2500);
                    } catch(e) {
                        window.location.href = fileUrl;
                        btnDownloadText.textContent = orig;
                    }
                }
                btnDownload.addEventListener('click', triggerDownload);
            }

            // Поделиться через нативный интерфейс смартфона
            btnShare.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'TRENDUM',
                            text: isAudio ? 'Мой персональный трек из Trendum! 🎵' : 'Мой снимок из Trendum!',
                            url: window.location.href
                        });
                    } catch(e) {}
                } else {
                    try {
                        await navigator.clipboard.writeText(window.location.href);
                        alert('Ссылка скопирована в буфер обмена!');
                    } catch(e) {
                        alert(window.location.href);
                    }
                }
            });
        })();
    </script>
</body>
</html>
