<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRENDUM — Ваше фото</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #D4A043;
            --primary-hover: #F3D289;
            --primary-glow: rgba(212, 160, 67, 0.35);
            --bg-dark: #0F0F12;
            --card-bg: #18181D;
            --border: rgba(212, 160, 67, 0.25);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 18px 40px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 160, 67, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(20, 20, 28, 0.8) 0%, transparent 70%);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--primary);
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .media-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 160, 67, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 22px;
        }

        .media-preview-box {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 380px;
        }

        .media-preview-box img,
        .media-preview-box video {
            width: 100%;
            height: auto;
            max-height: 65vh;
            object-fit: contain;
            display: block;
        }

        .actions {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-main {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #D4A043 0%, #F3D289 100%);
            border: none;
            border-radius: 16px;
            color: #121214;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px var(--primary-glow);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .btn-sub {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #FFFFFF;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-sub:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Карточка бутика / локации примерки */
        .boutique-card {
            width: 100%;
            max-width: 440px;
            background: rgba(212, 160, 67, 0.08);
            border: 1px solid rgba(212, 160, 67, 0.3);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: none;
        }

        .boutique-header {
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .boutique-title {
            font-size: 16px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 4px;
        }

        .boutique-loc {
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .boutique-price {
            margin-top: 8px;
            font-size: 18px;
            font-weight: 900;
            color: var(--primary);
        }

        .footer {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            margin-top: auto;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 160, 67, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand-logo">TRENDUM</div>
        <div class="brand-sub" id="page-subtitle">Ваш кадр готов</div>
    </div>

    <div class="media-card">
        <div class="media-preview-box" id="media-box">
            <div class="loading-spinner" id="loader"></div>
            <img id="photo-el" style="display: none;" alt="TRENDUM Photo">
            <video id="video-el" style="display: none;" playsinline autoplay loop muted controls></video>
        </div>
    </div>

    <!-- Карточка бутика (если передана в ссылке) -->
    <div class="boutique-card" id="boutique-card">
        <div class="boutique-header">ГДЕ ПРИМЕРИТЬ И КУПИТЬ</div>
        <div class="boutique-title" id="boutique-title">Товар из каталога</div>
        <div class="boutique-loc">
            <span>📍</span>
            <span id="boutique-loc">Уточняйте у консультанта</span>
        </div>
        <div class="boutique-price" id="boutique-price"></div>
    </div>

    <div class="actions">
        <button type="button" class="btn-main" id="btn-download">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="btn-download-text">СКАЧАТЬ В ГАЛЕРЕЮ</span>
        </button>

        <button type="button" class="btn-sub" id="btn-share">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>ПОДЕЛИТЬСЯ</span>
        </button>
    </div>

    <div class="footer">TRENDUM PHOTO KIOSK • ЧИСТОЕ КАЧЕСТВО</div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('file') || params.get('url') || '';
            const title = params.get('title') || '';
            const loc = params.get('loc') || '';
            const price = params.get('price') || '';

            const loader = document.getElementById('loader');
            const photoEl = document.getElementById('photo-el');
            const videoEl = document.getElementById('video-el');
            const btnDownload = document.getElementById('btn-download');
            const btnDownloadText = document.getElementById('btn-download-text');
            const btnShare = document.getElementById('btn-share');
            const boutiqueCard = document.getElementById('boutique-card');

            if (loc || price || title) {
                if (title) document.getElementById('boutique-title').textContent = title;
                if (loc) document.getElementById('boutique-loc').textContent = loc;
                if (price) document.getElementById('boutique-price').textContent = `${price} СОМ`;
                boutiqueCard.style.display = 'block';
            }

            if (!fileUrl) {
                loader.style.display = 'none';
                document.getElementById('page-subtitle').textContent = 'Ссылка на файл не найдена';
                return;
            }

            const isVideo = fileUrl.includes('.mp4') || fileUrl.includes('.webm') || fileUrl.includes('/video/');

            if (isVideo) {
                videoEl.src = fileUrl;
                videoEl.onloadeddata = () => {
                    loader.style.display = 'none';
                    videoEl.style.display = 'block';
                };
                videoEl.onerror = () => {
                    loader.style.display = 'none';
                    videoEl.style.display = 'block';
                };
            } else {
                photoEl.src = fileUrl;
                photoEl.onload = () => {
                    loader.style.display = 'none';
                    photoEl.style.display = 'block';
                };
                photoEl.onerror = () => {
                    loader.style.display = 'none';
                    photoEl.style.display = 'block';
                };
            }

            // Скачивание файла прямо в память телефона (галерею)
            async function triggerDownload() {
                const origText = btnDownloadText.textContent;
                btnDownloadText.textContent = '⏳ СОХРАНЕНИЕ...';
                try {
                    const resp = await fetch(fileUrl);
                    if (!resp.ok) throw new Error('Fetch failed');
                    const blob = await resp.blob();
                    const objectUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = objectUrl;
                    link.download = isVideo ? 'TRENDUM_VIDEO.mp4' : 'TRENDUM_PHOTO.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
                    btnDownloadText.textContent = '✅ СОХРАНЕНО!';
                    setTimeout(() => { btnDownloadText.textContent = origText; }, 2500);
                } catch(e) {
                    // Резервный переход
                    window.location.href = fileUrl;
                    btnDownloadText.textContent = origText;
                }
            }

            btnDownload.addEventListener('click', triggerDownload);

            // Поделиться через нативный интерфейс смартфона
            btnShare.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'TRENDUM Photo',
                            text: 'Мой снимок из Trendum!',
                            url: window.location.href
                        });
                    } catch(e) {}
                } else {
                    try {
                        await navigator.clipboard.writeText(window.location.href);
                        alert('Ссылка скопирована в буфер обмена!');
                    } catch(e) {
                        alert(window.location.href);
                    }
                }
            });
        })();
    </script>
</body>
</html>
